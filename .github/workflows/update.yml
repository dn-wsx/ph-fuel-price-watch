name: Update forecast and deploy

on:
  schedule:
    - cron: '30 22 * * 0-5'   # 06:30 PHT Mon-Sat, after US futures settle
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/test.mjs
      - name: Fetch DOE actual adjustments
        run: node scripts/fetch-doe-actuals.mjs
      - run: node scripts/update.mjs
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update forecast data" && git push)
      - name: Assemble site
        run: mkdir _site && cp -r index.html assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
