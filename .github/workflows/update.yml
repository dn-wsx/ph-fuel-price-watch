name: Update forecast and deploy

on:
  schedule:
    - cron: '30 22 * * 0-5'   # 06:30 PHT Mon-Sat, after US futures settle
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:          # "Run workflow" button; the fields below are optional
    inputs:
      date:
        description: 'Tuesday the adjustment took effect (YYYY-MM-DD). "auto" = most recent Tuesday'
        default: 'auto'
        required: false
      gasoline:
        description: 'Gasoline change in PHP per liter (rollback is negative, e.g. -0.50). Blank = skip'
        required: false
      diesel:
        description: 'Diesel change in PHP per liter (e.g. 1.20). Blank = skip'
        required: false
      kerosene:
        description: 'Kerosene change in PHP per liter (e.g. -0.30). Blank = skip'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node scripts/test.mjs
      - name: Install PDF text tool (to read DOE's Oil Monitor)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils
      - name: Record actual adjustment by hand (optional override, only when you filled in the form)
        if: github.event_name == 'workflow_dispatch'
        env:
          DATE: ${{ inputs.date }}
          G: ${{ inputs.gasoline }}
          D: ${{ inputs.diesel }}
          K: ${{ inputs.kerosene }}
        run: |
          args=()
          if [ -n "$G" ]; then args+=("gasoline=$G"); fi
          if [ -n "$D" ]; then args+=("diesel=$D"); fi
          if [ -n "$K" ]; then args+=("kerosene=$K"); fi
          if [ ${#args[@]} -gt 0 ]; then node scripts/add-actual.mjs "${DATE:-auto}" "${args[@]}"; else echo "No values entered, skipping."; fi
      - run: node scripts/update.mjs
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update forecast data" && git push)
      - name: Assemble site
        run: mkdir _site && cp -r index.html assets data _site/
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
